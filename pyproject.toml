[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzmij"
version = "0.1.0"
description = "Python binding for vitaut/zmij float formatting library"
readme = "README.md"
license = "MIT"
authors = [{name = "pyzmij contributors"}]
requires-python = ">=3.10"
keywords = ["float", "formatting", "json", "python", "c-extension"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/mp0rta/pyzmij"
Repository = "https://github.com/mp0rta/pyzmij"
Issues = "https://github.com/mp0rta/pyzmij/issues"
