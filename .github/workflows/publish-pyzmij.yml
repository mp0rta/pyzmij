name: Publish pyzmij

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Publish target for manual runs"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'pyzmij-v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux* *-win32"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: pyzmij-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'pyzmij-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build . -s

      - uses: actions/upload-artifact@v4
        with:
          name: pyzmij-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare dist directory
        run: |
          mkdir -p pyzmij-dist
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} pyzmij-dist/ \;
          ls -la pyzmij-dist

      - name: Install from built artifacts and smoke test
        run: |
          python -m venv .venv-test
          . .venv-test/bin/activate
          python -m pip install -U pip
          python -m pip install pyzmij-dist/*.whl
          python -c "import pyzmij; print(pyzmij.backend())"

      - name: Run tests against installed wheel
        run: |
          . .venv-test/bin/activate
          python -m pip install -U pytest
          python -m pytest -q tests --ignore=tests/test_repr_compat.py

  publish:
    needs: [verify-artifacts]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' && 'testpypi' || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare dist directory
        run: |
          mkdir -p pyzmij-dist
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} pyzmij-dist/ \;
          ls -la pyzmij-dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pyzmij-dist
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pyzmij-dist
